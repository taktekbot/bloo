<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Bloo</title>
<style>
:root{
  --bg:#EDEBE4; --panel:#F7F5EF; --panel2:#EFECE2; --ink:#2B231D; --muted:#8B8173;
  --line:#DDD6C7; --accent:#3672D9; --accent-soft:#3672D922;
  --radius:12px;
  --disp:"Avenir Next","Century Gothic",Futura,"Trebuchet MS",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#181716; --panel:#221F1D; --panel2:#2A2724; --ink:#EDE7DC; --muted:#9C9285;
    --line:#3A3630; --accent:#6FA8F0; --accent-soft:#6FA8F026;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--disp);color:var(--ink);background:var(--bg);font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
a.btn{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#card{
  width:min(400px,88%);text-align:center;background:var(--panel);
  border:1.5px dashed var(--muted);border-radius:18px;padding:34px 28px;
}
#card .star{font-size:30px;color:var(--accent);display:block;margin-bottom:10px}
#card .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
#card h1{font-size:18px;font-weight:600;margin-bottom:8px}
#card p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12.5px;font-weight:500}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="card">
  <span class="star">✳</span>
  <div class="eyebrow">Bloo</div>
  <h1>Page not found</h1>
  <p>That page doesn't exist. The link may be old, or the address was mistyped.</p>
  <div class="row">
    <a class="btn accent" href="/bloo/">Bloo home</a>
    <a class="btn" href="https://taktek.io/">taktek.io</a>
  </div>
</div>
</body>
</html>
